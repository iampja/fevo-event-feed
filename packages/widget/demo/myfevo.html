<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My FEVO – Rewards Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f5f7;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Top nav ===== */
    .nav {
      background: #1a1a1a;
      padding: 0 32px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .nav-logo {
      background: #FFCC00;
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 5px;
      letter-spacing: -0.5px;
    }
    .nav-title { color: #fff; font-size: 15px; font-weight: 700; }
    .nav-links { display: flex; gap: 6px; }
    .nav-links a {
      color: #9ca3af;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 5px;
      text-decoration: none;
      transition: all 0.12s;
    }
    .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .nav-links a.active { color: #FFCC00; background: rgba(255,204,0,0.1); }

    /* ===== Page layout ===== */
    .page { max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-brand">
      <div class="nav-logo">FEVO</div>
      <div class="nav-title">Rewards Dashboard</div>
    </div>
    <div class="nav-links">
      <a href="/demo/showcase.html">Showcase</a>
      <a href="/demo/">Demo</a>
      <a href="/demo/collections.html">Collections</a>
      <a href="/demo/rewards-demo.html">Rewards</a>
      <a href="/demo/myfevo.html" class="active" style="color:#FFCC00;font-weight:700;">My FEVO</a>
    </div>
  </nav>

  <div class="page">
    <!-- The widget auto-initializes on elements with class "fevo-my-fevo" -->
    <div class="fevo-my-fevo" data-theme="light"></div>
  </div>

  <script src="/src/index.ts" type="module"></script>
</body>
</html>
