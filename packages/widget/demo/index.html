<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Feed Widget Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Top nav ===== */
    .nav {
      background: #1a1a1a;
      padding: 0 32px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .nav-logo {
      background: #FFCC00;
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 5px;
      letter-spacing: -0.5px;
    }
    .nav-title { color: #fff; font-size: 15px; font-weight: 700; }
    .nav-links { display: flex; gap: 6px; }
    .nav-links a {
      color: #9ca3af;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 5px;
      text-decoration: none;
      transition: all 0.12s;
    }
    .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .nav-links a.active { color: #FFCC00; background: rgba(255,204,0,0.1); }

    .page { max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }
    h1 { color: #1a1a1a; margin-bottom: 8px; }
    .subtitle { color: #6b7280; margin-top: 0; margin-bottom: 40px; }
    .demo-section { margin: 40px 0; }
    .demo-section h2 {
      color: #6b7280;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    .dark-bg {
      background: #111827;
      padding: 24px;
      border-radius: 12px;
    }
    .analytics-log {
      background: #1a1a1a;
      color: #22c55e;
      padding: 16px;
      border-radius: 8px;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 40px;
    }
    .analytics-log p { margin: 2px 0; }
    .analytics-log .label { color: #eab308; }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-brand">
      <div class="nav-logo">FEVO</div>
      <div class="nav-title">Event Feed Widget</div>
    </div>
    <div class="nav-links">
      <a href="/demo/showcase.html">Showcase</a>
      <a href="/demo/" class="active">Demo</a>
      <a href="/demo/collections.html">Collections</a>
      <a href="/demo/marketplace.html">Marketplace</a>
      <a href="/demo/rewards-demo.html">Rewards</a>
      <a href="/demo/myfevo.html" style="color:#FFCC00;font-weight:700;">My FEVO</a>
    </div>
  </nav>

  <div class="page">
  <h1>FEVO Event Feed Widget - Demo</h1>
  <p class="subtitle">Embeddable event feed widget for partner sites</p>

  <div class="demo-section">
    <h2>Default (3 columns, light theme)</h2>
    <div id="fevo-event-feed" data-api-url="/api/v1/event-feed" data-api-key="efeed_test_key_abc123" data-theme="light"></div>
  </div>

  <div class="demo-section">
    <h2>Dark Theme (2 columns)</h2>
    <div class="dark-bg">
      <div class="fevo-event-feed" data-api-url="/api/v1/event-feed" data-api-key="efeed_test_key_abc123" data-theme="dark" data-columns="2"></div>
    </div>
  </div>

  <div class="demo-section">
    <h2>Analytics Event Log</h2>
    <div id="analytics-log" class="analytics-log">
      <p><span class="label">[info]</span> Listening for fevo:analytics events...</p>
    </div>
  </div>

  <script>
    // Listen for analytics events and log them
    window.addEventListener('fevo:analytics', function(e) {
      const log = document.getElementById('analytics-log');
      if (log && e.detail) {
        const p = document.createElement('p');
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = '[' + e.detail.type + ']';
        p.appendChild(label);
        p.appendChild(document.createTextNode(' ' + JSON.stringify(e.detail.data)));
        log.appendChild(p);
        log.scrollTop = log.scrollHeight;
      }
    });
  </script>

  </div>

  <script src="/src/index.ts" type="module"></script>
</body>
</html>
