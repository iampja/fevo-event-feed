services:
  # ── Backend API (Node.js Web Service) ─────────────────────────────────────
  - type: web
    name: fevo-event-feed-api
    runtime: node
    region: oregon
    buildCommand: npm install --include=dev && npm rebuild better-sqlite3 && npm run build --workspace=packages/backend
    startCommand: node packages/backend/dist/server.js
    healthCheckPath: /health
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/eventfeed.db
      - key: INTERNAL_AUTH_TOKEN
        generateValue: true
      # FEVO API integration (optional — uses mock client when not set)
      - key: FEVO_API_BASE_URL
        value: https://stage.gofevo.com
      - key: FEVO_USERNAME
        value: pjohnson@fevo.com
      - key: FEVO_PASSWORD
        value: TQR.dtb2tnz7khz1ukd
      - key: FEVO_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: 2293-edc
      - key: RESEED
        value: "true"

  # ── Admin UI (Static Site) ─────────────────────────────────────────────────
  - type: web
    name: fevo-event-feed-admin
    runtime: static
    buildCommand: npm install --include=dev && npm run build --workspace=packages/admin-ui
    staticPublishPath: packages/admin-ui/dist
    envVars:
      - key: VITE_API_URL
        value: https://fevo-event-feed-api.onrender.com/api/v1/event-feed
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Widget (Static Site) ───────────────────────────────────────────────────
  - type: web
    name: fevo-event-feed-widget
    runtime: static
    buildCommand: npm install --include=dev && npm run build --workspace=packages/widget
    staticPublishPath: packages/widget/dist
